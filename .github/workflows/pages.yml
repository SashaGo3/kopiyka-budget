# Deploys the static promo site in site/ to GitHub Pages.
#
# Pages is switched on for this repository (Settings → Pages → Source: "GitHub Actions"), so every
# push to main that touches site/ (or this file) publishes the site at
# https://sashago3.github.io/kopiyka-budget/ a minute later. "Run workflow" on the Actions tab
# deploys by hand.
#
# Serving WITHOUT Actions: Settings → Pages → "Deploy from a branch" only offers the repository root
# or /docs, not site/, so it would need site/ copied into docs/ or a gh-pages branch. Not worth it.
#
# Custom domain: see site/README.md (a CNAME file in site/).
# ---------------------------------------------------------------------------
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; do not cancel one that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # site/ is committed already built (HTML + images), so there is no build
      # step here. Rebuild locally with `bun run site` and commit the result.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
